spring.application.name=facade
server.port=${PORT:8080}
server.shutdown=graceful

# Database: MySQL in production (set DATABASE_URL, DB_USER, DB_PASSWORD).
# Without DATABASE_URL the app falls back to an in-memory H2 database so it runs out of the box.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:hotel;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Login session lifetime in minutes
app.auth.token-ttl-minutes=480
